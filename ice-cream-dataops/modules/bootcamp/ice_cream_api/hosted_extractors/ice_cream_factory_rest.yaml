name: ice-cream-factory-rest
externalId: ice_cream_factory_rest
description: REST-hosted extractor for the Ice Cream Factory API.
connector: cognite/rest
config:
  authentication:
    type: client_credentials
    tokenUri: {{ tokenUri }}
    clientId: {{ icapi_trigger_client_id }}
    clientSecret: {{ icapi_trigger_client_secret }}
    scopes:
      - {{ scopes }}
  target:
    dataSetId: {{ icapi_ds_external_id }}
