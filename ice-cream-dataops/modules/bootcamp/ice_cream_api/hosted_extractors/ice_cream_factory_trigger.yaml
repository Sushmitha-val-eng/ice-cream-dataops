name: ice-cream-factory-trigger
externalId: ice_cream_factory_trigger
description: REST-hosted extractor used to trigger data ingestion from the Ice Cream Factory API.
connector: cognite/rest
config:
  authentication:
    type: client_credentials
    tokenUri: {{ tokenUri }}
    clientId: {{ icapi_trigger_client_id }}
    clientSecret: {{ icapi_trigger_client_secret }}
    scopes:
      - {{ scopes }}
  target:
    dataSetId: "{{ icapi_ds_external_id }}"
