name: icapi_datapoints_extractor
externalId: icapi_datapoints_extractor
description: Cognite Function that pulls datapoints from the Ice Cream Factory API and stores them in CDF.
runtime: python311
functionPath: functions/icapi_datapoints_extractor/handler.py
cpu: 1
memory: 2Gi
environmentVariables:
  CDF_PROJECT: {{ cdfProjectName }}
  BASE_URL: https://ice-cream-factory.inso-internal.cognite.ai
secrets:
  - name: CDF_CLIENT_ID
    value: {{ icapi_extractors_client_id }}
  - name: CDF_CLIENT_SECRET
    value: {{ icapi_extractors_client_secret }}
schedule:
  name: icapi-datapoints-nightly
  cronExpression: "0 2 * * *"
  functionExternalId: icapi_datapoints_extractor
